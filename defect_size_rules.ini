; Defect size gate for the AIR EJECTOR (onefileV22.py).
; The file is re-read every time you press Start Detection.
;
; mode = off  -> old behaviour (no measuring)
; mode = log  -> measure + show size on screen + write CSV/crops, but the ejector decides as before
; mode = on   -> a grain-defect detection fires the ejector only if
;                spot size >= [min_spot_mm2] AND confidence >= [min_conf] for that class
;
; Only classes listed in [min_spot_mm2] are measured. Classes not listed there
; (paddy, Damaged_Grain, insects, ...) are never blocked by the size gate.
; Dangerous classes / servo are NOT affected by this file.

[general]
mode = log
; pixels per millimetre on the rail (measure a ruler in the camera image once)
px_per_mm = 16
; a pixel counts as "spot" if it is this much darker than the grain (0-255 gray)
dark_delta = 60
; ... or this much more yellow than the grain (LAB b channel), for Discolored_Grain
yellow_delta = 25
; save a small crop of every measured defect (max one per class every N seconds) for QC calibration
save_crops = true
crop_interval_s = 0.5
log_csv = output/defect_size/defect_size_log.csv

[min_spot_mm2]
; ejector fires only if the largest spot is at least this big (mm^2)
Black_head = 0.30
rice_big_dot = 0.30
Discolored_Grain = 1.50

[min_conf]
; optional stricter confidence per class (0-1); empty = use the Ejector confidence slider
Black_head = 0.75
