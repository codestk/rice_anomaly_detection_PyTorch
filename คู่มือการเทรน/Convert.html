<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Name Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sarabun", sans-serif;
        background-color: #f3f4f6;
      }
      /* Custom scrollbar for textareas */
      textarea::-webkit-scrollbar {
        width: 8px;
      }
      textarea::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 4px;
      }
      textarea::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 4px;
      }
      textarea::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-3xl overflow-hidden">
      <!-- Header -->
      <div class="bg-indigo-600 p-6 text-white">
        <h1 class="text-2xl font-bold">โปรแกรมดึงชื่อไฟล์จาก Path</h1>
        <p class="text-indigo-200 text-sm mt-1">
          แปลง Path ยาวๆ ให้เหลือแค่ชื่อไฟล์ พร้อมใส่เครื่องหมายคำพูด
        </p>
      </div>

      <div class="p-6 space-y-6">
        <!-- Input Section -->
        <div class="space-y-2">
          <label
            for="inputPaths"
            class="block text-sm font-semibold text-gray-700"
          >
            วางรายการ Path ไฟล์ (บรรทัดละ 1 Path)
          </label>
          <textarea
            id="inputPaths"
            rows="6"
            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-gray-600 font-mono text-sm"
            placeholder="ตัวอย่าง:
\\192.168.1.60\i\rice_anomaly\image1.png
\\192.168.1.60\i\rice_anomaly\image2.png"
          ></textarea>
        </div>

        <!-- Action Button -->
        <button
          onclick="convertPaths()"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-md"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"
            />
          </svg>
          แปลงข้อมูล (Convert)
        </button>

        <!-- Output Section -->
        <div class="space-y-2">
          <div class="flex justify-between items-end">
            <label
              for="outputResult"
              class="block text-sm font-semibold text-gray-700"
            >
              ผลลัพธ์
            </label>
            <span
              id="statusMsg"
              class="text-xs font-medium text-green-600 opacity-0 transition-opacity duration-300"
              >คัดลอกเรียบร้อย!</span
            >
          </div>
          <div class="relative">
            <textarea
              id="outputResult"
              rows="4"
              readonly
              class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 font-mono text-sm focus:outline-none resize-none"
            ></textarea>

            <button
              onclick="copyToClipboard()"
              class="absolute top-2 right-2 bg-white text-gray-600 hover:text-indigo-600 border border-gray-200 hover:border-indigo-300 p-1.5 rounded-md shadow-sm transition"
              title="คัดลอก"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"
                />
              </svg>
            </button>
          </div>
          <p class="text-xs text-gray-500">
            ผลลัพธ์จะอยู่ในรูปแบบ:
            <span class="font-mono bg-gray-200 px-1 rounded"
              >"file1.png" "file2.png"</span
            >
          </p>
        </div>
      </div>
    </div>

    <script>
      function convertPaths() {
        // 1. รับค่าจาก Textarea
        const inputText = document.getElementById("inputPaths").value;

        if (!inputText.trim()) {
          document.getElementById("outputResult").value = "";
          return;
        }

        // 2. แยกบรรทัด (Split by newline)
        const lines = inputText.split(/\r?\n/);

        // 3. วนลูปและประมวลผล
        const fileNames = lines
          .map((line) => line.trim()) // ตัดช่องว่างหน้าหลัง
          .filter((line) => line.length > 0) // กรองบรรทัดว่างออก
          .map((line) => {
            // ใช้ Regex หรือ split เพื่อเอาเฉพาะส่วนหลังสุดของ Path
            // รองรับทั้ง \ (Windows) และ / (Linux/Web)
            const parts = line.split(/[\\/]/);
            return parts[parts.length - 1];
          })
          .map((fileName) => `"${fileName}"`); // ใส่เครื่องหมายคำพูด

        // 4. รวมเป็น string เดียวคั่นด้วย space
        const result = fileNames.join(" ");

        // 5. แสดงผลลัพธ์
        document.getElementById("outputResult").value = result;
      }

      function copyToClipboard() {
        const outputText = document.getElementById("outputResult");

        // เลือกข้อความ
        outputText.select();
        outputText.setSelectionRange(0, 99999); // สำหรับมือถือ

        // สั่ง Copy
        try {
          document.execCommand("copy");

          // แจ้งเตือนว่า copy แล้ว
          const statusMsg = document.getElementById("statusMsg");
          statusMsg.classList.remove("opacity-0");

          // ซ่อนข้อความแจ้งเตือนหลังจาก 2 วินาที
          setTimeout(() => {
            statusMsg.classList.add("opacity-0");
          }, 2000);
        } catch (err) {
          console.error("ไม่สามารถคัดลอกได้", err);
        }
      }
    </script>
  </body>
</html>
